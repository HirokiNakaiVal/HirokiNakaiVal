{% extends "base.html" %}
{% block title %}パスワード変更｜日別稼働計画{% endblock %}
{% block crumbs %}<a href="/">トップ</a> › パスワード変更{% endblock %}
{% block body %}
<section class="card loginbox">
  <h1>パスワード変更</h1>
  {% if err %}<div class="msg err">{{ err }}</div>{% endif %}
  <form method="post" action="/account/password" autocomplete="off">
    <label>今のパスワード <input name="current" type="password" required></label>
    <label>新しいパスワード（8文字以上） <input name="new1" type="password" required minlength="8"></label>
    <label>新しいパスワード（確認） <input name="new2" type="password" required minlength="8"></label>
    <button class="primary">変更する</button>
  </form>
  <p class="muted small">変更すると、ほかの端末でのログインは無効になります。</p>
</section>
{% endblock %}
